name: Render Remotion Reel

on:
  repository_dispatch:
    types: [render-reel]

  workflow_dispatch:
    inputs:
      props:
        description: 'JSON inputProps for the Remotion composition'
        required: true
        type: string
      audio_url:
        description: 'Google Drive URL for the voiceover audio'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Setup Python & Whisper
        run: |
          pip install -q openai-whisper

      # --- Prepare payload ---
      - name: Prepare inputs (repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        run: |
          cat << 'PROPSEOF' > /tmp/props.json
          ${{ toJson(github.event.client_payload.props) }}
          PROPSEOF
          echo "AUDIO_URL=${{ github.event.client_payload.audio_url }}" >> $GITHUB_ENV
          echo "REEL_ID=${{ github.event.client_payload.reel_id }}" >> $GITHUB_ENV

      - name: Prepare inputs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat << 'PROPSEOF' > /tmp/props.json
          ${{ github.event.inputs.props }}
          PROPSEOF
          echo "AUDIO_URL=${{ github.event.inputs.audio_url }}" >> $GITHUB_ENV
          echo "REEL_ID=manual-$(date +%s)" >> $GITHUB_ENV

      # --- Setup rclone (needed for download + upload) ---
      - name: Setup rclone for Google Drive
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      # --- Download voiceover audio ---
      - name: Download voiceover audio
        run: |
          echo "🎙️ Downloading voiceover from Drive..."
          rclone copyto "vk889900:$AUDIO_URL" /tmp/voiceover.mp3
          echo "✅ Audio downloaded!"
          ls -lh /tmp/voiceover.mp3

      # --- Run Whisper to get word-level timestamps ---
      - name: Extract timestamps with Whisper
        run: |
          echo "🔍 Running Whisper for word-level timestamps..."
          python3 -c "
          import whisper
          import json

          model = whisper.load_model('base')
          result = model.transcribe('/tmp/voiceover.mp3', word_timestamps=True)

          # Extract word timestamps from segments
          output = {
              'text': result.get('text', ''),
              'duration': result.get('segments', [{}])[-1].get('end', 0) if result.get('segments') else 0,
              'words': [],
              'segments': result.get('segments', [])
          }

          for seg in result.get('segments', []):
              for w in seg.get('words', []):
                  output['words'].append({
                      'word': w['word'].strip(),
                      'start': round(w['start'], 3),
                      'end': round(w['end'], 3)
                  })

          with open('/tmp/whisper-output.json', 'w') as f:
              json.dump(output, f, indent=2)

          print(f'✅ Found {len(output[\"words\"])} words')
          print(f'📏 Audio duration: {output[\"duration\"]:.1f}s')
          for w in output['words'][:5]:
              print(f'  {w[\"start\"]:.2f}s-{w[\"end\"]:.2f}s: {w[\"word\"]}')
          print('  ...')
          "

      # --- Map Whisper timestamps to Remotion phrases ---
      - name: Map timestamps to phrases
        run: |
          echo "🗺️ Mapping word timestamps to phrases..."
          node scripts/map-timestamps.mjs \
            --whisper /tmp/whisper-output.json \
            --props /tmp/props.json \
            --output /tmp/props-synced.json \
            --fps 30
          echo "✅ Props synced with audio timestamps!"
          echo ""
          echo "📄 Synced props:"
          cat /tmp/props-synced.json | head -60
          
          # Extract totalFrames from synced props
          TOTAL_FRAMES=$(node -e "const p = require('/tmp/props-synced.json'); console.log(p.totalFrames)")
          echo "TOTAL_FRAMES=$TOTAL_FRAMES" >> $GITHUB_ENV
          echo "🎬 Total frames: $TOTAL_FRAMES"

      # --- Render video (silent, just visuals) ---
      - name: Render Remotion video
        run: |
          echo "🎬 Rendering MotivationalReel with synced timestamps..."
          npx remotion render MotivationalReel /tmp/video-silent.mp4 \
            --props=/tmp/props-synced.json \
            --codec=h264 \
            --image-format=jpeg \
            --frames=0-${TOTAL_FRAMES}
          echo "✅ Render complete!"
          ls -lh /tmp/video-silent.mp4

      # --- Merge video + audio into final reel ---
      - name: Merge video + audio
        run: |
          echo "🔀 Merging video + voiceover..."
          # Get video duration (which includes CTA/author after audio)
          VIDEO_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/video-silent.mp4)
          echo "Video duration: ${VIDEO_DUR}s"
          ffmpeg -i /tmp/video-silent.mp4 -i /tmp/voiceover.mp3 \
            -c:v copy \
            -c:a aac -b:a 192k \
            -map 0:v:0 -map 1:a:0 \
            -t ${VIDEO_DUR} \
            -y /tmp/final-reel.mp4
          echo "✅ Final reel created!"
          ls -lh /tmp/final-reel.mp4

      - name: Upload final reel to Google Drive
        id: upload
        run: |
          FILENAME="reel-${REEL_ID}.mp4"
          rclone copyto /tmp/final-reel.mp4 "vk889900:${{ secrets.OUTPUT_FOLDER_PATH }}/${FILENAME}"
          echo "✅ Uploaded to Google Drive: ${FILENAME}"
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      # --- Callback to n8n ---
      - name: Notify n8n - Success
        if: success() && env.N8N_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"success\",
              \"reel_id\": \"$REEL_ID\",
              \"filename\": \"${{ steps.upload.outputs.filename }}\"
            }"

      - name: Notify n8n - Failure
        if: failure() && env.N8N_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"failed\",
              \"reel_id\": \"$REEL_ID\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
